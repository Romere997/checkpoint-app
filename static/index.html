<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Checkpoint</title>
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#05070E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     CHECKPOINT · 2026 — "PS5 system UI × private bank"
     Deep abyssal field · glass optics · ○△□✕ glyph language
     ============================================================ */
  :root {
    --bg:#05070E; --raise:#0B0F1C;
    --glass:rgba(148,175,255,0.045); --stroke:rgba(158,182,255,0.11);
    --ink:#EAEEF9; --soft:#93A0C4; --faint:#5A6689;
    --indigo:#7FA5FF; --violet:#B29BFF;
    --green:#4FE3A8; --greendim:rgba(79,227,168,0.10);
    --coral:#FF7E70; --coraldim:rgba(255,126,112,0.09);
    --nav-bg:rgb(8,11,22);
    --shadow-color:rgba(0,0,0,0.5);
    --hair:rgba(158,182,255,0.09);
    --surface:rgba(148,175,255,0.045);
    --indigoSoft:rgba(127,165,255,.12);
    --greenSoft:rgba(79,227,168,.10);
    --coralSoft:rgba(255,126,112,.09);
    --amber:#F2C98B;
    --raise-style:0 1px 0 rgba(255,255,255,.03) inset, 0 18px 40px -18px rgba(0,0,0,.6);
    --specular:linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,0) 34%);
    --glow:0 0 24px rgba(127,165,255,.22);
    --shadow-btn:0 8px 20px -6px rgba(0,0,0,.5);
    --display:'Sora', -apple-system, sans-serif;
    --body:'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --ease-out: cubic-bezier(.22,1,.36,1);
    --ease-spring: cubic-bezier(.34,1.56,.64,1);
    --ease-in-out: cubic-bezier(.4,0,.2,1);
    --nav-glass-top:#05070E;
    --nav-glass-bottom:#060912;
  }
  @property --nav-glass-top {
    syntax: '<color>';
    inherits: true;
    initial-value: #05070E;
  }
  @property --nav-glass-bottom {
    syntax: '<color>';
    inherits: true;
    initial-value: #060912;
  }
  @property --nav-bg {
    syntax: '<color>';
    inherits: true;
    initial-value: rgb(8,11,22);
  }
  .light {
    --bg:#E9ECF3; --raise:#FFFFFF;
    --glass:rgba(255,255,255,0.62); --stroke:rgba(20,32,74,0.08);
    --ink:#161B2C; --soft:#525D7D; --faint:#8B93AC;
    --indigo:#3D63E0; --violet:#7B5CE5;
    --green:#0FA971; --greendim:rgba(15,169,113,0.10);
    --coral:#E25547; --coraldim:rgba(226,85,71,0.08);
    --nav-bg:rgb(244,246,250);
    --shadow-color:rgba(20,32,74,0.08);
    --hair:rgba(20,32,74,0.06);
    --surface:rgba(255,255,255,0.75);
    --indigoSoft:rgba(61,99,224,.09);
    --greenSoft:rgba(15,169,113,.09);
    --coralSoft:rgba(226,85,71,.08);
    --amber:#D9982F;
    --raise-style:0 1px 2px rgba(20,32,74,.05), 0 10px 28px -10px rgba(20,32,74,.12);
    --specular:linear-gradient(180deg, rgba(255,255,255,.85), rgba(255,255,255,0) 40%);
    --glow:0 0 20px rgba(61,99,224,.12);
    --shadow-btn:0 6px 16px -8px rgba(20,32,74,.22);
    --nav-glass-top:#E9ECF3;
    --nav-glass-bottom:#EEF1F6;
  }
  .theme-gold {
    --bg:#120C02; --raise:#1F1705;
    --glass:rgba(255,196,90,0.10); --stroke:rgba(255,196,90,0.18);
    --ink:#FFF1CC; --soft:#D4B870; --faint:#9A8345;
    --indigo:#FFD166; --violet:#FFC048;
    --green:#FFE08A; --greendim:rgba(255,224,138,0.10);
    --coral:#FFB84D; --coraldim:rgba(255,184,77,0.10);
    --nav-bg:rgb(18,14,4);
    --shadow-color:rgba(0,0,0,0.55);
    --hair:rgba(255,196,90,0.12);
    --surface:rgba(255,196,90,0.08);
    --indigoSoft:rgba(255,209,102,.14);
    --greenSoft:rgba(255,224,138,.12);
    --coralSoft:rgba(255,184,77,.10);
    --amber:#FFE08A;
    --raise-style:0 1px 0 rgba(255,196,90,.08) inset, 0 18px 40px -18px rgba(0,0,0,.65);
    --specular:linear-gradient(180deg, rgba(255,196,90,.14), rgba(255,196,90,0) 34%);
    --glow:0 0 24px rgba(255,196,90,.22);
    --shadow-btn:0 8px 20px -6px rgba(0,0,0,.55);
    --nav-glass-top:#120C02;
    --nav-glass-bottom:#120D03;
  }
  .theme-lime {
    --bg:#021205; --raise:#081F0D;
    --glass:rgba(128,255,150,0.10); --stroke:rgba(128,255,150,0.18);
    --ink:#CCFFD8; --soft:#7ACC8E; --faint:#3F8A55;
    --indigo:#66FF8A; --violet:#8AFFB3;
    --green:#B8FFCC; --greendim:rgba(184,255,204,0.10);
    --coral:#4DFF7A; --coraldim:rgba(77,255,122,0.10);
    --nav-bg:rgb(4,18,8);
    --shadow-color:rgba(0,0,0,0.55);
    --hair:rgba(128,255,150,0.12);
    --surface:rgba(128,255,150,0.08);
    --indigoSoft:rgba(102,255,138,.14);
    --greenSoft:rgba(184,255,204,.12);
    --coralSoft:rgba(77,255,122,.10);
    --amber:#A3FFB8;
    --raise-style:0 1px 0 rgba(128,255,150,.08) inset, 0 18px 40px -18px rgba(0,0,0,.65);
    --specular:linear-gradient(180deg, rgba(128,255,150,.14), rgba(128,255,150,0) 34%);
    --glow:0 0 24px rgba(128,255,150,.22);
    --shadow-btn:0 8px 20px -6px rgba(0,0,0,.55);
    --nav-glass-top:#021205;
    --nav-glass-bottom:#031206;
  }
  .theme-comic {
    --bg:#F4F4F7; --raise:#FFFFFF;
    --glass:rgba(255,255,255,0.72); --stroke:rgba(10,10,20,0.12);
    --ink:#0A0A14; --soft:#3A3A50; --faint:#7A7A90;
    --indigo:#FF2442; --violet:#FF8A1F;
    --green:#FFD600; --greendim:rgba(255,214,0,0.12);
    --coral:#FF5A1F; --coraldim:rgba(255,90,31,0.10);
    --nav-bg:rgb(244,244,247);
    --shadow-color:rgba(10,10,20,0.12);
    --hair:rgba(10,10,20,0.08);
    --surface:#FFFFFF;
    --indigoSoft:rgba(255,36,66,.10);
    --greenSoft:rgba(255,214,0,.12);
    --coralSoft:rgba(255,90,31,.10);
    --amber:#FF8A1F;
    --raise-style:0 1px 0 rgba(10,10,20,.04) inset, 0 12px 30px -14px rgba(10,10,20,.14);
    --specular:linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,255,255,0) 40%);
    --glow:0 0 24px rgba(255,36,66,.18);
    --shadow-btn:0 6px 16px -8px rgba(10,10,20,.20);
    --nav-glass-top:#F4F4F7;
    --nav-glass-bottom:#F4F4F7;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; }
  html,body { width:100%; height:100%; overflow:hidden; }
  html { background:var(--bg); transition:background .4s ease; }
  body {
    position:fixed; inset:0;
    background: var(--bg);
    color:var(--ink);
    font-family:var(--body);
    -webkit-font-smoothing:antialiased;
    display:flex; justify-content:center;
    overscroll-behavior:none;
    transition: background 0.4s ease, color 0.4s ease;
    line-height: 1.5;
    letter-spacing: 0.005em;
  }

  /* -------- ambient field (aurora + particles) -------- */
  #ambient {
    position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;
  }
  #ambient::before {
    content:''; position:absolute; inset:-20%;
    background:
      radial-gradient(48% 38% at 78% 8%, rgba(72,108,224,.20), transparent 66%),
      radial-gradient(52% 44% at 12% 30%, rgba(60,84,180,.15), transparent 66%),
      radial-gradient(60% 50% at 55% 100%, rgba(96,70,190,.07), transparent 68%);
    animation: auroraDrift 26s ease-in-out infinite alternate;
  }
  #ambient::after {
    content:''; position:absolute; inset:0;
    background:none;
  }
  .light #ambient::before {
    background:
      radial-gradient(48% 38% at 78% 8%, rgba(96,130,236,.16), transparent 66%),
      radial-gradient(52% 44% at 12% 30%, rgba(140,160,236,.14), transparent 66%),
      radial-gradient(60% 50% at 55% 100%, rgba(170,150,240,.12), transparent 68%);
  }
  .light #ambient::after, .theme-comic #ambient::after { background:none; }
  .theme-comic #ambient::before {
    background:
      radial-gradient(48% 38% at 78% 8%, rgba(255,36,66,.12), transparent 66%),
      radial-gradient(52% 44% at 12% 30%, rgba(255,138,31,.10), transparent 66%),
      radial-gradient(60% 50% at 55% 100%, rgba(255,214,0,.08), transparent 68%);
  }
  @keyframes auroraDrift {
    from { transform: translate3d(-2.5%, -1.5%, 0) scale(1); }
    to   { transform: translate3d(2.5%, 2%, 0) scale(1.07); }
  }
  .pt {
    position:absolute; bottom:-3vh; border-radius:50%;
    background: radial-gradient(circle, rgba(200,216,255,.9), rgba(200,216,255,0) 70%);
    animation: ptRise linear infinite;
    opacity:0;
  }
  .light .pt { background: radial-gradient(circle, rgba(61,99,224,.5), rgba(61,99,224,0) 70%); }
  .theme-comic .pt { background: radial-gradient(circle, rgba(255,36,66,.45), rgba(255,36,66,0) 70%); }
  @keyframes ptRise {
    0%   { transform: translateY(0); opacity:0; }
    12%  { opacity:var(--pt-o,.5); }
    82%  { opacity:var(--pt-o,.5); }
    100% { transform: translateY(-108vh); opacity:0; }
  }

  #app {
    width:100%; max-width:430px; height:100vh; height:100svh; min-height:0;
    display:flex; flex-direction:column; position:relative; overflow:hidden;
    z-index:1; transform:translateZ(0);
  }
  #app::after {
    content:''; position:absolute; left:0; right:0; bottom:0;
    height:calc(24px + env(safe-area-inset-bottom));
    background:transparent;
    pointer-events:none; z-index:30;
    display:none;
  }
  #screen {
    flex:1; min-height:0; overflow-y:auto; overscroll-behavior-y: contain; touch-action:pan-y;
    padding:max(20px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom));
    -webkit-overflow-scrolling: touch;
    scroll-behavior: smooth;
    padding-bottom: calc(20px + env(safe-area-inset-bottom) + 132px);
    transform: translateZ(0);
    backface-visibility: hidden;
    scrollbar-width: thin;
    scrollbar-color: rgba(148,175,255,0.35) transparent;
  }
  #screen::-webkit-scrollbar { width: 4px; }
  #screen::-webkit-scrollbar-track { background: transparent; }
  #screen::-webkit-scrollbar-thumb { background: rgba(148,175,255,0.35); border-radius: 999px; }
  .light #screen { scrollbar-color: rgba(20,32,74,0.25) transparent; }
  .light #screen::-webkit-scrollbar-thumb { background: rgba(20,32,74,0.25); }
  .theme-comic #screen { scrollbar-color: rgba(10,10,20,0.22) transparent; }
  .theme-comic #screen::-webkit-scrollbar-thumb { background: rgba(10,10,20,0.22); }

  .fadein { animation:fadein .38s var(--ease-out); }
  @keyframes fadein { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }
  @keyframes breathe { 0%,100%{transform:scale(1);opacity:.92} 50%{transform:scale(1.06);opacity:1} }
  @keyframes pop { 0%{transform:scale(.6);opacity:0} 60%{transform:scale(1.08)} 100%{transform:scale(1);opacity:1} }
  @keyframes shelfIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }
  @media (prefers-reduced-motion: reduce){
    .orb,.fadein,.history-item,.stat-card,.bigbtn,.theme-toggle,.pt,#ambient::before,
    .ft-ring-wrap::before,.ft-pct-num { animation:none !important; transition:none !important; }
  }

  /* -------- orb: glass sphere with orbital ring -------- */
  .orb {
    border-radius:50%; position:relative; animation:breathe 3.4s ease-in-out infinite; flex-shrink:0;
    will-change: transform;
    transform: translateZ(0);
    box-shadow:
      0 0 34px color-mix(in srgb, var(--hue,var(--indigo)) 28%, transparent),
      inset 0 1px 1px rgba(255,255,255,.22);
    contain: layout style paint;
  }
  .orb::after {
    content:''; position:absolute; inset:0; border-radius:50%; pointer-events:none;
    background:
      radial-gradient(circle at 30% 25%, rgba(255,255,255,.38) 0%, rgba(255,255,255,.08) 30%, transparent 56%),
      radial-gradient(circle at 70% 68%, rgba(127,165,255,.16) 0%, transparent 55%),
      linear-gradient(180deg, rgba(255,255,255,.14) 0%, transparent 45%, rgba(0,0,0,.14) 100%);
    mix-blend-mode: overlay;
  }
  .orb::before {
    content:''; position:absolute; inset:-9px; border-radius:50%; pointer-events:none;
    border:1px solid color-mix(in srgb, var(--hue,var(--indigo)) 30%, transparent);
    border-top-color: transparent; border-left-color: transparent;
    animation: orbRing 9s linear infinite;
    opacity:.7;
  }
  @keyframes orbRing { to { transform: rotate(360deg); } }
  .light .orb::after {
    background:
      radial-gradient(circle at 30% 25%, rgba(255,255,255,.55) 0%, rgba(255,255,255,.18) 30%, transparent 56%),
      radial-gradient(circle at 70% 68%, rgba(61,99,224,.18) 0%, transparent 55%),
      linear-gradient(180deg, rgba(255,255,255,.26) 0%, transparent 45%, rgba(0,0,0,.05) 100%);
  }
  .theme-comic .orb::after {
    background:
      radial-gradient(circle at 30% 25%, rgba(255,255,255,.55) 0%, rgba(255,255,255,.18) 30%, transparent 56%),
      radial-gradient(circle at 70% 68%, rgba(255,36,66,.18) 0%, transparent 55%),
      linear-gradient(180deg, rgba(255,255,255,.26) 0%, transparent 45%, rgba(0,0,0,.05) 100%);
  }

  /* -------- headers / sections -------- */
  .history-section { margin-top: 10px; padding-top: 8px; }
  .history-header {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 18px; gap: 12px; flex-wrap: wrap;
  }
  .history-header h1 {
    font-family:var(--display);
    font-size: 26px; font-weight: 700; letter-spacing: -0.03em;
  }
  .history-header .sub { font-size: 13.5px; color: var(--soft); margin-top: 3px; font-weight:500; }

  .range-pills {
    display: flex; gap: 4px;
    background: var(--surface);
    border:1px solid var(--stroke);
    padding: 4px; border-radius: 16px; margin-bottom: 20px;
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  }
  .range-pills button {
    flex: 1; border: none; background: none; font: inherit; font-size: 13px; font-weight: 700;
    color: var(--faint); padding: 9px 0; border-radius: 12px; cursor: pointer;
    transition: .2s var(--ease-out); letter-spacing:.01em;
  }
  .range-pills button.on {
    background: var(--indigoSoft); color: var(--indigo);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.06), var(--glow);
  }

  .hero-card {
    background: var(--surface);
    border: 1px solid var(--stroke);
    border-radius: 24px; padding: 22px; margin-bottom: 16px;
    backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
    transition: background .4s ease, border-color .4s ease;
    position:relative; overflow:hidden;
    box-shadow: var(--raise-style);
  }
  .hero-card::before {
    content:''; position:absolute; inset:0; border-radius:24px; pointer-events:none;
    background: var(--specular);
  }
  .hero-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .hero-number {
    font-family:var(--display);
    font-size: 44px; font-weight: 800; letter-spacing: -0.045em; line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .hero-number span { font-size: 17px; color: var(--faint); font-weight: 600; font-family:var(--body); letter-spacing:0; }
  .hero-pill {
    font-size: 12px; font-weight: 800; color: var(--green); background: var(--greenSoft);
    border:1px solid color-mix(in srgb, var(--green) 25%, transparent);
    padding: 6px 12px; border-radius: 999px; letter-spacing:.02em;
  }
  .hero-meta { font-size: 13px; color: var(--soft); margin-top: 10px; font-weight:500; }

  .stack-track {
    display: flex; height: 8px; border-radius: 999px; overflow: hidden;
    margin-top: 18px; gap: 2px; background: var(--hair);
  }
  .stack-track i { display: block; height: 100%; border-radius: 999px; box-shadow: 0 0 10px currentColor; }
  .legend-row { display: flex; gap: 16px; margin-top: 14px; flex-wrap: wrap; }
  .legend-row div {
    display: flex; align-items: center; gap: 7px;
    font-size: 12.5px; color: var(--soft); font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .legend-row i { width: 8px; height: 8px; border-radius: 3px; }

  .stats-row { display: flex; gap: 10px; margin-bottom: 22px; }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--stroke); border-radius: 20px; padding: 15px 10px;
    text-align: center; position: relative; overflow: hidden; flex: 1;
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    transition: transform .2s var(--ease-out), border-color .4s ease, background .4s ease;
    box-shadow: var(--raise-style);
  }
  .stat-card::after {
    content: ''; position: absolute; inset: 0; border-radius: 20px; pointer-events: none;
    background: var(--specular);
  }
  .stat-card:active { transform: scale(.97); }
  .stat-value, .stat-num {
    font-family:var(--display);
    font-size: 23px; font-weight: 800; letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
  }
  .stat-label {
    font-size: 10.5px; color: var(--faint); font-weight: 800; margin-top: 5px;
    letter-spacing: .1em; text-transform: uppercase;
  }

  .section-eyebrow {
    font-size: 10.5px; letter-spacing: .26em; text-transform: uppercase;
    color: var(--faint); font-weight: 800; margin: 26px 0 12px;
    display:flex; align-items:center; gap:10px;
  }
  .section-eyebrow::after { content:''; flex:1; height:1px; background:var(--hair); }

  .agent-strip {
    background: var(--surface); border: 1px solid var(--stroke); border-radius: 22px;
    padding: 4px 16px; margin-bottom: 22px;
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    transition: background .4s ease, border-color .4s ease;
    box-shadow: var(--raise-style);
  }
  .agent-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--hair); }
  .agent-row:last-child { border-bottom: none; }
  .agent-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 10px currentColor; }
  .agent-name { font-size: 14.5px; font-weight: 700; flex: 1; letter-spacing:-.01em; }
  .agent-meta { font-size: 12.5px; color: var(--faint); font-variant-numeric: tabular-nums; font-weight:700; }
  .agent-bar-wrap { width: 64px; height: 5px; border-radius: 999px; background: var(--hair); overflow: hidden; }
  .agent-bar { display: block; height: 100%; border-radius: 999px; }

  .history-card {
    background: var(--surface); border: 1px solid var(--stroke); border-radius: 22px;
    padding: 17px; margin-bottom: 10px; position:relative; overflow:hidden;
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    transition: transform .2s var(--ease-out), border-color .4s ease, background .4s ease;
    box-shadow: var(--raise-style);
  }
  .history-card::before {
    content:''; position:absolute; inset:0; border-radius:22px; pointer-events:none;
    background: var(--specular); opacity:.6;
  }
  .history-card:active { transform: scale(.985); }
  .history-card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; }
  .history-card-q { font-size: 14.5px; line-height: 1.5; font-weight: 600; color: var(--ink); letter-spacing:-.005em; }
  .history-card-reason {
    font-size: 13px; color: var(--soft); margin-top: 9px; padding-left: 12px;
    border-left: 2px solid color-mix(in srgb, var(--indigo) 35%, transparent);
    line-height: 1.5; font-style: italic;
  }
  .history-card-footer {
    display: flex; align-items: center; gap: 8px; margin-top: 11px;
    font-size: 11.5px; color: var(--faint); font-weight:600;
    font-variant-numeric: tabular-nums;
  }
  .verdict-pill {
    font-size: 10.5px; font-weight: 800; letter-spacing: .1em;
    padding: 5px 11px; border-radius: 9px;
    border:1px solid currentColor;
  }
  .empty-state { color: var(--faint); font-size: 14px; padding: 14px 0; font-weight:500; }

  .eyebrow {
    font-size: 10.5px; letter-spacing:.28em; text-transform:uppercase;
    color:var(--faint); font-weight:800;
  }
  .glass {
    background:var(--surface); border:1px solid var(--stroke); border-radius:22px; padding:18px;
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    transition: background 0.4s ease, border-color 0.4s ease;
    box-shadow: var(--raise-style);
    position:relative; overflow:hidden;
  }
  .glass::before {
    content:''; position:absolute; inset:0; border-radius:22px; pointer-events:none;

<body>
<div id="ambient"></div>
<div id="app">
  <div id="screen"></div>
  <nav id="nav"></nav>
</div>
<button class="theme-toggle" id="themeToggle" title="Toggle theme">◐</button>

<script>
/* ============ Checkpoint phone app — talks to the real API ============ */

/* ---------- ambient particle field ---------- */
(function initParticles(){
  const host = document.getElementById('ambient');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce || !host) return;
  for(let i=0;i<24;i++){
    const p = document.createElement('span');
    p.className = 'pt';
    const size = 1.5 + Math.random()*2.5;
    p.style.width = p.style.height = size + 'px';
    p.style.left = (Math.random()*100) + '%';
    p.style.setProperty('--pt-o', (0.15 + Math.random()*0.4).toFixed(2));
    p.style.animationDuration = (16 + Math.random()*22) + 's';
    p.style.animationDelay = (-Math.random()*30) + 's';
    host.appendChild(p);
  }
})();

const HUES = {};
const PALETTE = ['#7FA5FF','#5EDBE0','#B29BFF','#F2C98B','#4FE3A8','#FF7E70'];
function hueFor(agent){
  if(!HUES[agent]) HUES[agent] = PALETTE[Object.keys(HUES).length % PALETTE.length];
  return HUES[agent];
}

const STAGES = [
  { key: 1, label: 'Capture', icon: '□', desc: 'Capture the raw idea.' },
  { key: 2, label: 'Clarify', icon: '◇', desc: 'Clarify the problem and shape.' },
  { key: 3, label: 'Research', icon: '△', desc: 'Reviewing files, gathering references, and checking whether the idea is worth moving forward.' },
  { key: 4, label: 'Validate', icon: '○', desc: 'Validate assumptions and risks.' },
  { key: 5, label: 'Plan', icon: '▤', desc: 'Turn the idea into an actionable plan.' },
  { key: 6, label: 'Execute', icon: '✕', desc: 'Start execution with clear next actions.' },
];
function stageInfo(stage){
  const s = STAGES.find(x => x.key === stage) || STAGES[0];
  return s;
}
function stagePct(stage){
  return Math.round(((stage - 1) / (STAGES.length - 1)) * 100);
}

function renderBrainStepper(stage){
  return `<div class="stepper-wrap"><div class="stepper">
    ${STAGES.map((s, i) => {
      const cls = s.key < stage ? 'done' : s.key === stage ? 'active' : '';
      const line = i < STAGES.length - 1 ? `<div class="stepper-line" style="background:${s.key < stage ? 'var(--green)' : 'var(--stroke)'}"></div>` : '';
      return `<div class="stepper-step ${cls}">
        <div class="stepper-circle">${s.icon}</div>
        <div class="stepper-label">${s.label}</div>
      </div>${line}`;
    }).join('')}
  </div></div>`;
}

/* ---------- theme ---------- */
function applyTheme(){
  const themeClasses = ['light','theme-gold','theme-lime','theme-comic'];
  document.documentElement.classList.remove(...themeClasses);
  document.body.classList.remove(...themeClasses);
  const activeClass = S.theme === 'light' ? 'light' : (S.theme !== 'dark' ? `theme-${S.theme}` : '');
  if(activeClass){
    document.documentElement.classList.add(activeClass);
    document.body.classList.add(activeClass);
  }
  const themeMeta = document.querySelector('meta[name="theme-color"]');
  const themeColor = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  if(themeMeta && themeColor) themeMeta.setAttribute('content', themeColor);
  if($themeToggle) $themeToggle.textContent = THEME_ICONS[S.theme] || '◐';
  try { localStorage.setItem('cp_theme', S.theme); } catch(e){}
}
function toggleTheme(){
  const idx = THEME_ORDER.indexOf(S.theme);
  S.theme = THEME_ORDER[(idx + 1) % THEME_ORDER.length];

}

/* ---------- date range ---------- */
const DAY = 86400 * 1000;
function startOfDay(ts){
  const d = new Date(ts);
  d.setHours(0,0,0,0);
  return d.getTime();
}
function startOfWeek(ts){
  const d = new Date(ts);
  const day = d.getDay();
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() - day);
  return d.getTime();
}
function startOfMonth(ts){
  const d = new Date(ts);
  d.setHours(0,0,0,0);
  d.setDate(1);
  return d.getTime();
}
function inRange(ts){
  const now = Date.now();
  if(ts > now) return false;
  const age = now - ts;
  if(age > 100 * DAY) return false;
  if(S.range === 'all') return true;
  if(S.range === 'week') return ts >= startOfWeek(now);
  if(S.range === 'month') return ts >= startOfMonth(now);
  return true;
}
function filteredHistory(){
  return S.history.filter(c => inRange((c.answered_at || c.created_at) * 1000));
}
function setRange(r){
  S.range = r;
  renderHistory();
}

/* ---------- sounds ---------- */
let audioCtx = null;
function ensureAudio(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') audioCtx.resume();
}
function playTone(freq, start, dur, type='sine', vol=.25){
  if(!audioCtx) return;
  const t0 = audioCtx.currentTime + start;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(vol, t0);
  gain.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t0);
  osc.stop(t0 + dur);
}
function coinSound(){
  ensureAudio();
  playTone(1200, .00, .08, 'sine', .35);
  playTone(1800, .04, .12, 'sine', .18);
}
function tapSound(){
  ensureAudio();
  playTone(800, .00, .025, 'sine', .12);
}
document.addEventListener('click', (e)=>{
  if(e.target.closest('button')){
    tapSound();
  }
});

/* ---------- api ---------- */
async function api(path, opts={}){
  const res = await fetch(path, {
    ...opts,
    headers: { 'Content-Type':'application/json', 'X-API-Key': S.key, ...(opts.headers||{}) },
  });
  if(res.status === 401){ S.view='setup'; render(true); throw new Error('auth'); }
  if(!res.ok) throw new Error(await res.text());
  return res.json();
}

/* ---------- smart render guard ---------- */
const prevRenderSig = { main: null };

function renderSig(){
  if(S.view === 'question' && S.active) return `q:${S.active.id}:${S.active.status}`;
  if(S.view === 'history') return `h:${S.history.length}:${S.history[0]?.id || ''}`;
  if(S.view === 'setup') return 'setup';
  return `l:${S.pending.length}:${S.pending[0]?.id || ''}:${S.err}`;
}

let scrollBeforeRender = 0;
function captureScroll(){ scrollBeforeRender = $screen.scrollTop; }
function restoreScroll(){ requestAnimationFrame(()=>{ $screen.scrollTop = scrollBeforeRender; }); }

/* ---------- polling ---------- */
async function refresh(){
  try{
    const [p, all, brain] = await Promise.all([
      api('/api/checkpoints?status=pending'),
      api('/api/checkpoints?status=all'),
      api('/api/brain-dumps?status=all'),
    ]);
    const prevLen = S.pending.length;
    S.pending = p.checkpoints;
    const cutoff = Date.now() - 100 * 86400 * 1000;
    S.history = all.checkpoints.filter(c => c.status === 'answered' && c.created_at * 1000 >= cutoff);
    S.brainDumps = brain.brain_dumps || [];
    S.err = '';

    // pulse badge if pending count changed
    if(S.pending.length !== prevLen){
      coinSound();
      const badge = document.querySelector('.badge');
      if(badge){ badge.classList.remove('pulse'); void badge.offsetWidth; badge.classList.add('pulse'); }
    }
  }catch(e){ if(e.message!=='auth') S.err = 'Can\u2019t reach the server.'; }
  render();
}

function startPolling(){
  clearInterval(S.pollTimer);
  S.pollTimer = setInterval(refresh, 12000);
  refresh();
}

/* ---------- answers ---------- */
async function submitAnswer(cp, answer, reason=''){
  await api(`/api/checkpoints/${cp.id}/answer`, { method:'POST', body: JSON.stringify({answer, reason}) });
  S.doneNote = `${cp.agent} has your answer.`;
  S.view = 'done'; S.active = cp;
  render();
  setTimeout(()=>{ S.view='list'; S.active=null; refresh(); }, 1800);
}

/* ---------- rendering ---------- */
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;'); }

function orb(size,hue){
  return `<div class="orb" style="width:${size}px;height:${size}px;--hue:${hue};
    background:radial-gradient(circle at 35% 30%, ${hue}33, transparent 62%)"></div>`;
}

function chip(agent){
  const hue=hueFor(agent);
  return `<span class="chip" style="--hue:${hue}"><span class="dot"></span>${esc(agent)}</span>`;
}

function render(force=false){
  renderNav();
  const sig = renderSig();
  if(!force && sig === prevRenderSig.main) return;
  prevRenderSig.main = sig;

  if(S.view==='setup') return renderSetup();
  if(S.tab==='checkpoint'){
    if(S.view==='question' && S.active) return renderQuestion(S.active);
    if(S.view==='reason' && S.active) return renderReason(S.active);
    if(S.view==='done' && S.active) return renderDone();
    return renderList();
  }
  if(S.tab==='brain'){
    if(S.view==='brain-create') return renderBrainCreate();
    if(S.view==='brain-detail' && S.brainActive) return renderBrainDetail(S.brainActive);
    return renderBrainList();
  }
  if(S.tab==='history') return renderHistory();
  if(S.tab==='music') return renderMusic();
}

    const pad = (n) => String(n).padStart(2,'0');
    const hours = d.getHours() % 12 || 12;
    const ampm = d.getHours() < 12 ? 'AM' : 'PM';
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(hours)}:${pad(d.getMinutes())} ${ampm}`;
  };
  $screen.innerHTML = `
    <div class="fadein" style="padding-top:6px">
      <div class="history-section">
        <div class="history-header">
          <div>
            <h1>${esc(item.title || 'Idea')}</h1>
            <div class="sub">${esc(item.body || '')}</div>
          </div>
        </div>
        <div class="hero-card">
          <div class="hero-top">
            <div class="hero-number">${stagePct(item.stage || 1)}<span>%</span></div>
            <div class="hero-pill">Stage ${item.stage || 1} of ${STAGES.length}</div>
          </div>
          <div class="hero-meta">Idea Progress</div>
          ${renderBrainStepper(item.stage || 1)}
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px">
            ${(item.attachments || []).map(name => `<a class="chip" href="/uploads/${esc(name)}" target="_blank" download style="text-decoration:none">📎 ${esc(name)}</a>`).join('') || '<div style="color:var(--faint);font-size:13px">No attachments</div>'}
          </div>
          <div style="margin-top:10px">${item.tags.length ? item.tags.map(t => '#' + esc(t)).join(' ') : 'No tags'}</div>
          <div style="color:var(--soft);font-size:12px;margin-top:8px">Updated ${fmt(item.updated_at)}</div>
        </div>
        <div id="bd_events" style="margin-top:14px"></div>
        <div style="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap">
          <button class="bigbtn primary" onclick="S.brainView='list';renderBrainList()">Back</button>
        </div>
      </div>
    </div>`;
  loadBrainEvents(item.id);
  restoreScroll();
}

/* ============ history ============ */

function renderHistory(){
  captureScroll();
  const list = filteredHistory();
  const yes=list.filter(c=>c.answer==='yes').length;
  const no=list.filter(c=>c.answer==='no').length;
  const other=list.length-yes-no;
  const total=list.length||1;
  const pct=Math.round((yes+other)/total*100);
  const fmt = (ts) => {
    if(!ts) return '';
    const d = new Date(ts * 1000);
    const pad = (n) => String(n).padStart(2,'0');
    const hours = d.getHours() % 12 || 12;
    const ampm = d.getHours() < 12 ? 'AM' : 'PM';
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(hours)}:${pad(d.getMinutes())} ${ampm}`;
  };
  $screen.innerHTML = `
    <div class="fadein" style="padding-top:6px">
      <div class="history-section">
        <div class="history-header">
          <div>
            <h1>History</h1>
            <div class="sub">Your commitment loop.</div>
          </div>
        </div>

        <div class="range-pills">
          <button class="${S.range==='week'?'on':''}" onclick="setRange('week')">Week</button>
          <button class="${S.range==='month'?'on':''}" onclick="setRange('month')">Month</button>
          <button class="${S.range==='all'?'on':''}" onclick="setRange('all')">All time</button>
        </div>

        <div class="hero-card">
          <div class="hero-top">
            <div class="hero-number">${total}<span> answered</span></div>
            <div class="hero-pill">${pct}% follow-through</div>
          </div>
          <div class="hero-meta"> answered decisions</div>
          <div class="stack-track">
            <i style="flex:${yes||0.1};background:var(--green);color:var(--green)"></i>
            <i style="flex:${other||0.1};background:var(--indigo);color:var(--indigo)"></i>
            <i style="flex:${no||0.1};background:var(--coral);color:var(--coral)"></i>
          </div>
          <div class="legend-row">
            <div><i style="background:var(--green)"></i>${yes} confirmed</div>
            <div><i style="background:var(--indigo)"></i>${other} decisions</div>
            <div><i style="background:var(--coral)"></i>${no} blocked</div>
          </div>
        </div>

        <div class="stats-row">
          <div class="stat-card">
            <div class="stat-value" style="color:var(--indigo)">${new Set(list.map(c=>c.agent)).size}</div>
            <div class="stat-label">Agents asking</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" style="color:var(--green)">${total ? Math.round((yes+other)/total*100) : 0}<span style="font-size:16px">%</span></div>
            <div class="stat-label">Answered, not expired</div>
          </div>
        </div>

        <div class="section-eyebrow">Who needs you most</div>
        <div class="agent-strip">
          ${(() => {
            const map = new Map();
            list.forEach(c => { map.set(c.agent, (map.get(c.agent) || 0) + 1); });
            const palette = ['#7FA5FF','#5EDBE0','#B29BFF','#F2C98B','#4FE3A8','#FF7E70'];
            const rows = [...map.entries()].sort((a,b)=>b[1]-a[1]).slice(0,5);
            const max = rows[0]?.[1] || 1;
            return rows.map(([agent,count],i)=>`
              <div class="agent-row">
                <i class="agent-dot" style="background:${palette[i%palette.length]};color:${palette[i%palette.length]}"></i>
                <span class="agent-name">${esc(agent)}</span>
                <div class="agent-bar-wrap"><span class="agent-bar" style="width:${Math.round(count/max*100)}%;background:${palette[i%palette.length]}"></span></div>
                <span class="agent-meta">${count}</span>
              </div>`).join('') || '<div class="empty-state">No answered items yet.</div>';
          })()}
        </div>

        <div class="section-eyebrow">Recent</div>
        ${list.slice(0,20).map(c=>`
          <div class="history-card">
            <div class="history-card-top">
              <span class="chip"><i class="dot" style="background:var(--indigo)"></i>${esc(c.agent)}</span>
              <span class="verdict-pill" style="color:${c.answer==='yes'?'var(--green)':c.answer==='no'?'var(--coral)':'var(--indigo)'};background:${c.answer==='yes'?'var(--greenSoft)':c.answer==='no'?'var(--coralSoft)':'var(--indigoSoft)'}">${esc((c.answer||'').toUpperCase())}</span>
            </div>
            <div class="history-card-q">${esc(c.question)}</div>
            ${c.answer_reason?`<div class="history-card-reason">"${esc(c.answer_reason)}"</div>`:''}
            <div class="history-card-footer">
              <span>${fmt(c.created_at)}</span><span>·</span><span style="color:var(--green);font-weight:700">${c.answered_at ? 'answered '+fmt(c.answered_at) : 'pending'}</span>
            </div>
          </div>`).join('') || '<div class="empty-state">Nothing answered yet.</div>'}
      </div>
    </div>`;
  restoreScroll();
}

/* ---------- music ---------- */
async function refreshMusic(){
  try{
    const data = await api('/api/music');
    S.music = data.items || [];
  }catch(e){
    S.music = [];
  }
}
function fmtBytes(n){
  if(!n && n !== 0) return '';
  if(n < 1024) return n + ' B';
  if(n < 1024*1024) return Math.round(n/1024) + ' KB';
  return (n/(1024*1024)).toFixed(1) + ' MB';
}
function fmtTime(sec){
  if(!isFinite(sec) || sec < 0) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m + ':' + String(s).padStart(2,'0');
}
/* ---------- music control icons (inline SVG, theme-aware) ---------- */
const MUSIC_ICONS = {
  prev: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 6h2v12H6zM20 6l-9 6 9 6z"/></svg>',
  next: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 6h2v12h-2zM4 6l9 6-9 6z"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
  back15: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5V2L7.5 6 12 10V7a5 5 0 1 1-5 5H4.5a7.5 7.5 0 1 0 7.5-7z"/><text x="12" y="16.2" text-anchor="middle" font-size="7.5" font-weight="700" fill="currentColor" stroke="none">15</text></svg>',
  fwd15: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5V2l4.5 4L12 10V7a5 5 0 1 0 5 5h2.5a7.5 7.5 0 1 1-7.5-7z"/><text x="12" y="16.2" text-anchor="middle" font-size="7.5" font-weight="700" fill="currentColor" stroke="none">15</text></svg>',
};
function musicIcon(name){
  return MUSIC_ICONS[name] || '';
}
function renderMusic(){
  captureScroll();
  const items = S.music;
  const current = S.musicCurrent;
  const currentItem = current ? items.find(m => m.name === current.name) : null;
  const artUrl = currentItem ? currentItem.art_url : null;
  const now = current ? current.name.replace(/\.[^.]+$/, '') : 'Choose something below';
  $screen.innerHTML = `
    <div class="fadein" style="padding-top:6px">
      <div class="history-section">
        <div class="history-header">
          <div>
            <h1>Music</h1>
            <div class="sub">Local files, played losslessly.</div>
          </div>
        </div>
        <div class="music-now" id="musicNowCard">
          <div class="music-art">${artUrl ? `<img class="music-art-img" src="${esc(artUrl)}" alt="Album art" onerror="this.style.display='none';this.parentNode.textContent='♫'">` : '♫'}</div>
          <div class="music-status" id="musicStatus">Idle</div>
          <div class="music-title" id="musicTitle">${esc(now)}</div>
          <div class="music-sub">Local library</div>
          <div class="music-times">
            <span id="musicTimeCur">0:00</span>
            <div id="musicSeek" class="music-seek">
              <div class="music-track">
                <div id="musicProgress" class="music-progress"></div>
                <div id="musicThumb" class="music-thumb"></div>
              </div>
            </div>
            <span id="musicTimeDur">0:00</span>
          </div>
          <div class="music-controls">
            <button class="music-ctrl" onclick="prevTrack()" title="Previous" aria-label="Previous">${musicIcon('prev')}</button>
            <button class="music-ctrl" onclick="skipMusic(-15)" title="Back 15s" aria-label="Back 15 seconds">${musicIcon('back15')}</button>
            <button class="music-ctrl play" id="musicPlayBtn" onclick="toggleMusicPlayback()" aria-label="Play or pause">${musicIcon('play')}</button>
            <button class="music-ctrl" onclick="skipMusic(15)" title="Forward 15s" aria-label="Forward 15 seconds">${musicIcon('fwd15')}</button>
            <button class="music-ctrl" onclick="nextTrack()" title="Next" aria-label="Next">${musicIcon('next')}</button>
          </div>
        </div>
        <div class="section-eyebrow">Library</div>
        ${items.length ? `<div class="music-list">${items.map(item => {
          const label = item.name.replace(/\.[^.]+$/, '');
          const playUrl = item.optimized_url || item.url;
          const buffered = S.musicBuffered.has(item.url);
          const isCur = current && current.name === item.name;
          return `<div class="music-card${isCur?' on':''}" data-url="${esc(item.url)}" data-buffered="${buffered?1:0}" onclick="playMusic('${esc(playUrl)}','${esc(item.name)}')">
            <div class="music-card-icon">${item.art_url ? `<img class="music-card-thumb" src="${esc(item.art_url)}" alt="" loading="lazy" onerror="this.style.display='none'">` : (isCur?'♪':'♫')}</div>
            <div class="music-card-body">
              <div class="music-card-title">${esc(label)}</div>
              <div class="music-card-meta">${fmtBytes(item.size)}${item.source_bitrate ? `<span class="music-kbps">${Math.round(item.source_bitrate/1000)}k</span>` : ''}</div>
            </div>
            ${isCur ? '<span class="music-eq"><i></i><i></i><i></i></span>' : '<span class="music-chev">›</span>'}
          </div>`;
        }).join('')}</div>` : '<div class="empty-state">No music files found.</div>'}
      </div>
    </div>`;
  restoreScroll();
  updateMusicControls();
  initSeekBar();
  (items || []).forEach((item) => preloadMusic(item.optimized_url || item.url, item.name));
}
function updateMusicControls(){
  const audio = S.audio;
  if(!audio) return;
  const cur = document.getElementById('musicTimeCur');
  const dur = document.getElementById('musicTimeDur');
  const bar = document.getElementById('musicProgress');
  const thumb = document.getElementById('musicThumb');
  const status = document.getElementById('musicStatus');
  const btn = document.getElementById('musicPlayBtn');
  if(cur) cur.textContent = fmtTime(audio.currentTime);
  if(dur) dur.textContent = isFinite(audio.duration) ? fmtTime(audio.duration) : '0:00';
  const pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
  if(bar) bar.style.width = pct + '%';
  if(thumb) thumb.style.left = pct + '%';
  if(status) status.textContent = S.musicPlaying ? 'Now playing' : 'Paused';
  if(btn) btn.innerHTML = S.musicPlaying ? musicIcon('pause') : musicIcon('play');
  updateMediaSessionPosition();
}
/* ---------- iOS / lock-screen media session ---------- */
function updateMediaSession(){
  if(!('mediaSession' in navigator)) return;
  const cur = S.musicCurrent;
  const item = S.music.find(m => m.url === (cur ? cur.url : null)) || null;
  const title = cur ? cur.name.replace(/\.[^.]+$/, '') : 'Checkpoint';
  try{
    navigator.mediaSession.metadata = new MediaMetadata({
      title: title,
      artist: (item && item.artist) || 'Local library',
      album: (item && item.album) || '',
      artwork: item && item.art_url ? [
        { src: item.art_url, sizes: '512x512', type: 'image/jpeg' }
      ] : [],
    });
  }catch(e){}
  try{
    navigator.mediaSession.setActionHandler('play', () => { if(!S.musicPlaying) toggleMusicPlayback(); });
    navigator.mediaSession.setActionHandler('pause', () => { if(S.musicPlaying) toggleMusicPlayback(); });
    navigator.mediaSession.setActionHandler('previoustrack', () => prevTrack());
    navigator.mediaSession.setActionHandler('nexttrack', () => nextTrack());
    navigator.mediaSession.setActionHandler('seekbackward', (d) => skipMusic(-(d.seekOffset || 15)));
    navigator.mediaSession.setActionHandler('seekforward', (d) => skipMusic(d.seekOffset || 15));
  }catch(e){}
  updateMediaSessionPosition();
}
function updateMediaSessionPosition(){
  if(!('mediaSession' in navigator) || !navigator.mediaSession.setPositionState) return;
  const audio = S.audio;
  if(!audio || !isFinite(audio.duration) || !S.musicPlaying){
    try{ navigator.mediaSession.setPositionState(null); }catch(e){}
    return;
  }
  try{
    navigator.mediaSession.setPositionState({
      duration: audio.duration,
      playbackRate: audio.playbackRate || 1,
      position: audio.currentTime,
    });
  }catch(e){}
}
function seekFromEvent(e){
  const audio = S.audio;
  if(!audio || !isFinite(audio.duration)) return;
  const el = document.getElementById('musicSeek');
  if(!el) return;
  const rect = el.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  let pct = (clientX - rect.left) / rect.width;
  pct = Math.max(0, Math.min(1, pct));
  audio.currentTime = pct * audio.duration;
  updateMusicControls();
}
function skipMusic(seconds){
  const audio = S.audio;
  if(!audio || !isFinite(audio.duration)) return;
  audio.currentTime = Math.max(0, Math.min(audio.duration, audio.currentTime + seconds));
  updateMusicControls();
}
function prevTrack(){
  if(!S.music.length) return;
  const idx = S.music.findIndex(m => m.url === (S.musicCurrent ? S.musicCurrent.url : null));
  const prev = S.music[(idx - 1 + S.music.length) % S.music.length];
  playMusic(prev.optimized_url || prev.url, prev.name);
}
function nextTrack(){
  if(!S.music.length) return;
  const idx = S.music.findIndex(m => m.url === (S.musicCurrent ? S.musicCurrent.url : null));
  const next = S.music[(idx + 1) % S.music.length];
  playMusic(next.optimized_url || next.url, next.name);
}
function initSeekBar(){
  const el = document.getElementById('musicSeek');
  if(!el) return;
  if(el.dataset.seekBound) return;
  el.dataset.seekBound = '1';
  let dragging = false;
  const start = (e) => {
    dragging = true;
    seekFromEvent(e);
    try { el.setPointerCapture(e.pointerId); } catch(_) {}
  };
  const move = (e) => {
    if(!dragging) return;
    seekFromEvent(e);
  };
  const end = (e) => {
    dragging = false;
    try { el.releasePointerCapture(e.pointerId); } catch(_) {}
  };
  el.addEventListener('pointerdown', start);
  el.addEventListener('pointermove', move);
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}
function playMusic(url, name){
  if(S.audio){ S.audio.pause(); S.audio = null; }
  const audio = new Audio(url);
  S.audio = audio;
  S.musicCurrent = { url, name };
  S.musicPlaying = true;
  audio.play().catch(() => {});
  audio.addEventListener('timeupdate', updateMusicControls);
  audio.addEventListener('ended', () => { S.musicPlaying = false; updateMusicControls(); });
  renderMusic();
  initSeekBar();
  updateMediaSession();
}
function toggleMusicPlayback(){
  if(!S.audio || !S.musicCurrent){
    if(S.music.length){
      const first = S.music[0];
      playMusic(first.url, first.name);
    }
    return;
  }
  if(S.musicPlaying){
    S.audio.pause();
    S.musicPlaying = false;
  } else {
    S.audio.play().catch(() => {});
    S.musicPlaying = true;
  }
  updateMusicControls();
}
function stopMusic(){
  if(S.audio){ S.audio.pause(); S.audio.removeEventListener('timeupdate', updateMusicControls); S.audio = null; }
  if(S.preload){ S.preload.pause(); S.preload.src = ''; S.preload = null; }
  S.musicCurrent = null;
  S.musicPlaying = false;
  S.musicBuffered = new Set();
  renderMusic();
}
function preloadMusic(url, name){
  try {
    if(!S.preload){
      S.preload = new Audio();
      S.preload.preload = 'auto';
    }
    if(S.preload.src !== url){
      S.preload.pause();
      S.preload.src = url;
      S.preload.load();
    }
    S.musicBuffered.add(url);
    updateMusicBufferUI();
  } catch(e) {}
}
function updateMusicBufferUI(){
  document.querySelectorAll('.music-card[data-buffered="1"]').forEach(el => {
    el.querySelector('.music-buffer-dot')?.remove();
  });
  S.musicBuffered.forEach(url => {
    const el = document.querySelector(`.music-card[data-url="${esc(url)}"]`);
    if(!el) return;
    if(el.querySelector('.music-buffer-dot')) return;
    const dot = document.createElement('span');
    dot.className = 'music-buffer-dot';
    dot.textContent = '·';
    dot.style.cssText = 'margin-left:8px;font-size:14px;color:var(--green);font-weight:800;vertical-align:1px';
    el.querySelector('.music-card-body')?.appendChild(dot);
  });
}

/* ---------- boot ---------- */
if(!S.key){ S.view='setup'; render(true); }
else {
  refresh();
  refreshMusic();
}
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && S.key) refresh(); });
</script>
